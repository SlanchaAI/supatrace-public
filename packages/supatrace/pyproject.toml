[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supatrace"
version = "0.1.0"
description = "Alpha Python client for SupaTrace."
authors = [{name = "Slancha, Inc."}]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["supatrace", "tracing", "observability", "opentelemetry", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
# OTLP export is optional. Importing or using source mode needs no dependencies.
dependencies = []

[project.urls]
Homepage = "https://supatrace.dev"
Documentation = "https://supatrace.dev/docs/"
"Bug Tracker" = "mailto:support@supatrace.dev"

[project.optional-dependencies]
otlp = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[tool.hatch.build.targets.sdist]
only-include = ["src/supatrace/__init__.py", "src/supatrace/py.typed", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.hatch.build.targets.wheel]
only-include = ["src/supatrace/__init__.py", "src/supatrace/py.typed"]
sources = ["src"]
