name: Langfuse acceptance preflight (not activated)
run-name: Langfuse acceptance is not activated

on:
  workflow_dispatch:

permissions: {}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Stop before credentials, capture or upload
        shell: bash
        run: |
          printf '%s\n' '{"version":1,"outcome":"not-activated","live_import_ready":false,"credentials_loaded":false,"source_requests":0,"destination_requests":0}'
          exit 78
