name: Bug report
description: Report a reproducible problem using synthetic data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, follow SECURITY.md. Do not include credentials or real trace payloads.'
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic example and the command you ran.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions, and local or hosted service. Remove private data from logs.
