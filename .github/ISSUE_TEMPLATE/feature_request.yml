name: Feature request
description: Describe a problem and the outcome you need.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
